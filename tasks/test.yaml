# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/tasks.schema.json
variables:
  - name: PLAYWRIGHT_EXECUTOR
    default: docker
  - name: PLAYWRIGHT_COMMAND
    default: npx --no-install playwright

tasks:
  - name: all
    actions:
      - task: health-check
      - task: ingress
      - task: ui

  # Ensure application deploys successfully and becomes available
  - name: health-check
    actions:
      - description: Podinfo Health Check
        wait:
          cluster:
            kind: Deployment
            name: podinfo
            namespace: podinfo
            condition: Available

  - name: ingress
    actions:
      - description: "Podinfo unauthenticated ingress redirects to UDS SSO"
        maxRetries: 30
        cmd: |
          set -euo pipefail
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl --max-redirs 0 -D "$headers" -o /dev/null -sS -w '%{http_code}' https://podinfo.uds.dev/)
          location=$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")
          echo "Podinfo unauthenticated status: ${status}"
          if [ "$status" != "302" ] && [ "$status" != "303" ]; then
            echo "Expected an authentication redirect, got ${status}" >&2
            sleep 10
            exit 1
          fi
          case "$location" in
            https://sso.uds.dev/*) ;;
            *)
              echo "Expected redirect to UDS SSO, got: ${location:-<missing>}" >&2
              sleep 10
              exit 1
              ;;
          esac

  - name: ui
    description: Podinfo UI Checks
    actions:
      - cmd: |
          set -euo pipefail
          case "$PLAYWRIGHT_EXECUTOR" in
            docker)
              version=$(uds zarf tools yq -r '.devDependencies."@playwright/test"' package.json)
              gateway_args=()
              if [[ -n "${UDS_GATEWAY_IP:-}" ]]; then
                gateway_args+=(
                  "--add-host=podinfo.uds.dev:${UDS_GATEWAY_IP}"
                  "--add-host=sso.uds.dev:${UDS_GATEWAY_IP}"
                )
              fi
              exec docker run --rm \
                "${gateway_args[@]}" \
                --network=host \
                --shm-size=1g \
                --security-opt seccomp=unconfined \
                --user "$(id -u):$(id -g)" \
                -e HOME=/tmp \
                -e NPM_CONFIG_CACHE=/tmp/.npm \
                -e PLAYWRIGHT_BROWSERS \
                -e BASE_URL \
                -e UDS_REQUIRE_EXTERNAL_CREDENTIALS \
                -e UDS_TEST_USERNAME \
                -e UDS_TEST_PASSWORD \
                -v "$(pwd)":/app -w /app \
                "mcr.microsoft.com/playwright:v$version" \
                bash -lc 'npm ci && npx playwright test'
              ;;
            direct)
              exec bash -c "$PLAYWRIGHT_COMMAND test"
              ;;
            *)
              echo "PLAYWRIGHT_EXECUTOR must be docker or direct: $PLAYWRIGHT_EXECUTOR" >&2
              exit 1
              ;;
          esac
        dir: tests
        shell:
          linux: bash
          darwin: bash
