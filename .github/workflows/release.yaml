name: Release

on:
  push:
    branches:
      - main

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.
  packages: read # Allows reading the content of the repository's packages.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # Allows writing the content of the repository.
      packages: write # Allows writing the content of the repository's packages.
      id-token: write
    strategy:
      matrix:
        flavor: [upstream]
        architecture: [amd64]
    steps:
      - name: Build, test, sign, and publish
        uses: defenseunicorns/uds-common/.github/actions/publish@807de6f4efca9f51ee5e8d3e466d5f089c9eaab8 # v1.34.1
        with:
          flavor: ${{ matrix.flavor }}
          options: --set BASE_REPO="ghcr.io/byronlowry"
